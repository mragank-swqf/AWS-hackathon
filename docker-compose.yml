services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: regimpact
      POSTGRES_PASSWORD: regimpact
      POSTGRES_DB: regimpact
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regimpact -d regimpact"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sqs
      DEBUG: "0"
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
    volumes:
      - ./docker/localstack:/etc/localstack/init/ready.d
      - localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  chroma:
    image: chromadb/chroma:0.5.23
    ports:
      - "8001:8000"
    environment:
      ANONYMIZED_TELEMETRY: "False"
      IS_PERSISTENT: "TRUE"
    volumes:
      - chroma_data:/chroma/chroma
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment: &app-env
      DATABASE_URL: postgresql://regimpact:regimpact@postgres:5432/regimpact
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: regimpact-documents
      SQS_QUEUE_URL: http://localstack:4566/000000000000/regimpact-jobs
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      chroma:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m app.worker
    environment: *app-env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      chroma:
        condition: service_healthy

volumes:
  postgres_data:
  localstack_data:
  chroma_data:
